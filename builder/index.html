<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlowSuite Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
<style>:root{--bg:#07090f;--s1:#0c1120;--s2:#111827;--s3:#1a2340;--teal:#00d4aa;--ta:rgba(0,212,170,.13);--text:#e2e8f0;--muted:#64748b;--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);--danger:#f43f5e;--ok:#34d399}*{box-sizing:border-box;margin:0;padding:0}html,body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}.nav{background:var(--s1);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:99}.nav-av{width:40px;height:40px;border-radius:50%;overflow:hidden;border:2px solid var(--teal);flex-shrink:0}.nav-av img{width:100%;height:100%;object-fit:cover}.nav-t{font-size:15px;font-weight:700;color:var(--teal)}.nav-s{font-size:11px;color:var(--muted)}.wrap{max-width:600px;margin:0 auto;padding:20px 16px 60px}.card{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px}.ct{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:18px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg{display:flex;flex-direction:column;gap:5px}.fg.full{grid-column:1/-1}.fg label{font-size:11px;font-weight:600;color:var(--muted)}.req{color:var(--danger)}input,select,textarea{background:var(--bg);border:1px solid var(--border2);border-radius:8px;padding:10px 13px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;outline:none;transition:border-color .15s;width:100%;-webkit-appearance:none}input:focus,select:focus,textarea:focus{border-color:var(--teal)}select option{background:var(--s2)}textarea{resize:vertical;min-height:80px}.svc-tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}.svc-tag{display:inline-flex;align-items:center;gap:6px;background:var(--s3);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px}.svc-x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:0;line-height:1}.svc-x:hover{color:var(--danger)}.svc-row{display:flex;gap:8px}.svc-row input{flex:1}.sadd{padding:10px 16px;background:var(--s3);border:1px solid var(--border2);border-radius:8px;color:var(--text);cursor:pointer;font-size:20px;font-family:inherit;flex-shrink:0;line-height:1}.sadd:hover{border-color:var(--teal)}.err-msg{color:var(--danger);font-size:12px;margin-bottom:8px;min-height:16px}.gen-btn{width:100%;padding:15px;background:var(--teal);color:#07090f;border:none;border-radius:11px;font-family:'Inter',sans-serif;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;transition:opacity .15s}.gen-btn:hover{opacity:.88}.gen-btn:disabled{opacity:.45;cursor:not-allowed}.output{background:var(--s1);border:1.5px solid rgba(0,212,170,.35);border-radius:14px;overflow:hidden;margin-top:14px;display:none}.output.on{display:block}.oh{padding:14px 18px;border-bottom:1px solid var(--border);color:var(--teal);font-size:13px;font-weight:700}.ob-wrap{padding:14px 18px}.ol{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px}.url-box{background:var(--bg);border:1px solid var(--border2);border-radius:8px;padding:10px 12px;font-size:11px;font-family:monospace;color:var(--teal);word-break:break-all;margin-bottom:14px;cursor:pointer}.wa-box{background:var(--bg);border:1px solid var(--border2);border-radius:8px;padding:12px;font-size:12px;line-height:1.6;white-space:pre-wrap;max-height:200px;overflow-y:auto;margin-bottom:14px}.out-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.ob{padding:11px 6px;border-radius:8px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border2);background:var(--s2);color:var(--text);text-align:center;transition:all .15s}.ob:hover{border-color:var(--teal);color:var(--teal)}.ob.wa{background:#25D366;color:#fff;border-color:#25D366}
@media(max-width:400px){.g2{grid-template-columns:1fr}}</style>
<link rel="icon" href="/favicon.png">
</head>
<body>
<nav class="nav">
  <div class="nav-av"><img src="/flow-avatar.png" alt="FLOW"></div>
  <div><div class="nav-t">FlowSuite Builder</div><div class="nav-s">Configura tu agente FLOW en minutos</div></div>
</nav>
<div class="wrap">
  <div class="card">
    <div class="ct">Datos del negocio</div>
    <div class="g2">
      <div class="fg"><label>Nombre <span class="req">*</span></label><input type="text" id="bn" placeholder="Bar du Lac"></div>
      <div class="fg"><label>Sector <span class="req">*</span></label><select id="bs"><option value="">Seleccionar...</option><option>Restaurante / Bar</option><option>Alojamiento / Hotel</option><option>Clinica / Fisioterapia</option><option>Dentista</option><option>Coach / Consultor</option><option>Inmobiliaria</option><option>Taller mecanico</option><option>Estetica / Belleza</option><option>Otro</option></select></div>
      <div class="fg"><label>Ciudad</label><input type="text" id="bc" placeholder="Lausanne"></div>
      <div class="fg"><label>WhatsApp</label><input type="tel" id="bt" placeholder="+41 79 000 00 00"></div>
      <div class="fg full"><label>Slogan (opcional)</label><input type="text" id="bsl" placeholder="La mejor terraza con vistas al lago"></div>
      <div class="fg"><label>Idioma</label><select id="bl"><option value="es">ES Espanol</option><option value="fr">FR Francais</option><option value="de">DE Deutsch</option><option value="en">EN English</option><option value="it">IT Italiano</option></select></div>
      <div class="fg"><label>Web (opcional)</label><input type="url" id="bw" placeholder="https://negocio.ch"></div>
    </div>
  </div>
  <div class="card">
    <div class="ct">Servicios clave</div>
    <div class="svc-tags" id="svc-tags"></div>
    <div class="svc-row"><input type="text" id="svc-inp" placeholder="Ej: Menu del dia 18 CHF" onkeydown="if(event.key==='Enter'){addSvc();event.preventDefault();}"><button class="sadd" onclick="addSvc()">+</button></div>
  </div>
  <div class="card">
    <div class="ct">Contexto adicional</div>
    <textarea id="bprompt" placeholder="Ej: El dueno se llama Marc, le preocupa que no responde WhatsApp los fines de semana."></textarea>
  </div>
  <div style="margin-top:6px">
    <div class="err-msg" id="err-msg"></div>
    <button class="gen-btn" id="gen-btn" onclick="generate()">Generar demo personalizada</button>
  </div>
  <div class="output" id="output">
    <div class="oh">Demo lista para enviar</div>
    <div class="ob-wrap">
      <div class="ol">Link de la demo</div>
      <div class="url-box" id="out-url" onclick="copyUrl()"></div>
      <div class="ol">Mensaje WhatsApp</div>
      <div class="wa-box" id="out-wa"></div>
      <div class="out-btns">
        <button class="ob" id="copy-btn" onclick="copyUrl()">Copiar link</button>
        <button class="ob wa" onclick="sendWA()">WhatsApp</button>
        <button class="ob" onclick="viewDemo()">Ver demo</button>
      </div>
    </div>
  </div>
</div>
<script>
const svcs=[];let lastUrl='',lastWa='';
function addSvc(){const inp=document.getElementById('svc-inp');const v=inp.value.trim();if(!v)return;svcs.push(v);inp.value='';renderSvcs();}
function removeSvc(i){svcs.splice(i,1);renderSvcs();}
function renderSvcs(){document.getElementById('svc-tags').innerHTML=svcs.map((s,i)=>'<span class="svc-tag"><span style="color:var(--teal);font-size:10px">v</span>'+s+'<button class="svc-x" onclick="removeSvc('+i+')">x</button></span>').join('');}
function generate(){const n=document.getElementById('bn').value.trim();const s=document.getElementById('bs').value;const err=document.getElementById('err-msg');if(!n||!s){err.textContent='Nombre y sector son obligatorios.';return;}err.textContent='';const btn=document.getElementById('gen-btn');btn.disabled=true;btn.textContent='Generando...';setTimeout(()=>{const data={n,s,c:document.getElementById('bc').value.trim(),sl:document.getElementById('bsl').value.trim(),l:document.getElementById('bl').value,t:document.getElementById('bt').value.trim(),w:document.getElementById('bw').value.trim(),sv:svcs.join('\n'),trial:new Date().toISOString().split('T')[0]};const comp=LZString.compressToEncodedURIComponent(JSON.stringify(data));lastUrl='https://flowsuite.ch/demo#'+comp;lastWa=buildWA(n,s,data.c,data.t,document.getElementById('bprompt').value.trim(),lastUrl);document.getElementById('out-url').textContent=lastUrl;document.getElementById('out-wa').textContent=lastWa;document.getElementById('output').classList.add('on');btn.disabled=false;btn.textContent='Regenerar demo';document.getElementById('output').scrollIntoView({behavior:'smooth',block:'nearest'});},400);}
function buildWA(n,s,c,t,prompt,url){const ct=c?' en '+c:'';const extra=prompt?'\n\nNota: '+prompt:'';return 'Hola!\n\nHe preparado una demo de FlowSuite para '+n+ct+'.'+extra+'\n\nAsistente IA 24/7 en 5 idiomas\nCaptura leads automaticamente\nAdaptado al sector: '+s+'\n\n'+url+'\n\nIncluve 14 dias gratis - sin tarjeta ni compromiso.\n\nTienes 5 minutos para verlo?\n\n- FlowSuite | flowsuite.ch';}
function copyUrl(){navigator.clipboard.writeText(lastUrl).catch(()=>{});const btn=document.getElementById('copy-btn');btn.textContent='Copiado!';setTimeout(()=>{btn.textContent='Copiar link';},1800);}
function sendWA(){const raw=document.getElementById('bt').value.replace(/[\s\+\-\(\)]/g,'');const num=raw.startsWith('0')?'41'+raw.slice(1):raw;window.open((num?'https://wa.me/'+num:'https://wa.me/')+'?text='+encodeURIComponent(lastWa),'_blank');}
function viewDemo(){window.open(lastUrl,'_blank');}
</script>
</body>
</html>

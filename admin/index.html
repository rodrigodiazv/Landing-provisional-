<head>

<title>FlowSuite — Admin</title>
<link rel="icon" href="/favicon.png">

  </div>
</div>
<div id="app">
  <aside class="sb">
    <div class="sb-logo"><div class="sb-logo-img">🧠</div></div>
    <nav class="sb-nav">
      <div class="sn on" onclick="tab('dashboard',this)" data-tip="Dashboard">📊

      <div class="sb-av">R</div>
      <div class="sb-out" onclick="logout()">⏏
/div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="tb-title" id="tb-title">Dashboard</div>
      <div class="tb-badge">Superadmin</div>
    </header>
    <div id="panel-root" style="flex:1;overflow-y: auto;padding:24px">
      <div style="color:var(--t2);font-size:13px">Cargando panel...</div>
    </div>
  </div>
</div>

<script src="/admin/app.js"></script>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlowSuite — Legal</title>
<meta name="robots" content="index,follow">
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
:root{--bg:#02030d;--s1:#060d1a;--teal:#00d4aa;--tx:#eef4fc;--t2:#8aa2b8;--bd:rgba(255,255,255,.09)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.75}
header{position:sticky;top:0;background:rgba(2,3,13,.95);border-bottom:1px solid var(--bd);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header a{color:var(--tx);text-decoration:none;font-weight:800;font-family:'Space Grotesk',system-ui,sans-serif}
.langs{display:flex;gap:4px}.langs button{background:none;border:1px solid var(--bd);color:var(--t2);border-radius:6px;padding:4px 8px;font-weight:700;font-size:12px;font-family:inherit;cursor:pointer}
.langs button.on{color:var(--teal);border-color:var(--teal)}
nav.docs{display:flex;gap:14px;flex-wrap:wrap;padding:14px 16px;max-width:820px;margin:0 auto;font-size:13px}
nav.docs a{color:var(--t2)}nav.docs a.on{color:var(--teal)}
main{max-width:820px;margin:0 auto;padding:8px 16px 64px;color:var(--t2);font-size:15px}
h1{font-family:'Space Grotesk',system-ui,sans-serif;color:var(--tx);font-size:clamp(26px,5vw,36px);margin:10px 0 4px}
h3{font-family:'Space Grotesk',system-ui,sans-serif;color:var(--tx);font-size:17px;margin:26px 0 8px}
p{margin-bottom:10px}ul{margin:0 0 12px 20px}li{margin-bottom:6px}
a{color:var(--teal)}strong{color:var(--tx)}
.upd{font-size:13px;margin-bottom:12px}
footer{border-top:1px solid var(--bd);padding:20px 16px;text-align:center;font-size:12px;color:var(--t2)}
</style>
</head>
<body data-doc="terms">
<header><a href="/">🧠 FlowSuite</a><div class="langs" id="langs"></div></header>
<nav class="docs" id="docs"></nav>
<main><h1 id="title"></h1><p class="upd" id="upd"></p><div id="content"></div></main>
<footer>© 2026 FlowSuite · Rodrigo A. Díaz Videla · <a href="mailto:info@flowsuite.ch">info@flowsuite.ch</a></footer>
<script src="/legal.js"></script>
<script src="/assets/js/legal-page.js"></script>
</body>
</html>
